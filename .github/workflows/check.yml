name: Unfollower Check

on:
  # Run every 12 hours
  schedule:
    - cron: '0 */12 * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  check-unfollowers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run unfollower check
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: 'true'
        run: node index.js --run-now

      - name: Save updated followers list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add followers.json
          git diff --cached --quiet || git commit -m "📊 Update followers snapshot [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
